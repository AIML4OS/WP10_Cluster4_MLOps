<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 540" role="img" aria-labelledby="t d">
  <title id="t">Monitoring and retraining loop</title>
  <desc id="d">The production model logs every prediction. Predictions above a confidence threshold are auto-coded, the rest go to human annotation, together with a random audit sample of auto-coded records. The prediction log feeds label-free monitoring signals; annotations feed label-based signals and the labelled data store. Alerts and new labelled data trigger a reproducible retraining pipeline — train, validate against the champion, shadow test, promote — which deploys a new production version.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .prod { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.4; }
    .human { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
    .mon { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
    .retrain { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.4; }
    .chip { fill: #ffffff; stroke: #8b5cf6; stroke-width: 1.1; }
    .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; }
    .head { font-size: 14px; font-weight: 700; }
    .chip-head { font-size: 13px; font-weight: 700; }
    .col { font-size: 12.5px; font-weight: 700; fill: #9a3412; }
    .sub { font-size: 12px; fill: #475569; }
    .item { font-size: 12.5px; }
    .lbl { font-size: 11.5px; fill: #475569; font-style: italic; }
    .edge { stroke: #475569; stroke-width: 1.7; fill: none; }
    .dash { stroke: #475569; stroke-width: 1.7; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect x="0" y="0" width="1030" height="540" fill="#ffffff"/>

  <g transform="translate(30,0)">

    <!-- Row 1: production flow -->
    <rect class="prod" x="30" y="30" width="200" height="80" rx="10"/>
    <text class="head" x="46" y="56">Production model</text>
    <text class="sub" x="46" y="76">API or batch job, version N</text>
    <text class="sub" x="46" y="94">tagged in the registry</text>

    <rect class="box" x="280" y="30" width="220" height="80" rx="10"/>
    <text class="head" x="296" y="56">Prediction log</text>
    <text class="sub" x="296" y="76">input · code · confidence</text>
    <text class="sub" x="296" y="94">model version · timestamp</text>

    <rect class="box" x="550" y="30" width="170" height="80" rx="10"/>
    <text class="head" x="566" y="62">Confidence ≥ τ ?</text>
    <text class="sub" x="566" y="84">threshold set at</text>
    <text class="sub" x="566" y="100">validation (Ch. 2)</text>

    <rect class="prod" x="780" y="20" width="190" height="55" rx="10"/>
    <text class="head" x="796" y="44">Auto-coded</text>
    <text class="sub" x="796" y="62">used directly downstream</text>

    <rect class="human" x="780" y="125" width="190" height="60" rx="10"/>
    <text class="head" x="796" y="149">Human annotation</text>
    <text class="sub" x="796" y="168">low confidence + audit</text>

    <path class="edge" d="M230,70 L278,70" marker-end="url(#arrow)"/>
    <path class="edge" d="M500,70 L548,70" marker-end="url(#arrow)"/>
    <path class="edge" d="M720,55 L778,47" marker-end="url(#arrow)"/>
    <text class="lbl" x="738" y="44">yes</text>
    <path class="edge" d="M720,90 L778,150" marker-end="url(#arrow)"/>
    <text class="lbl" x="730" y="132">no</text>
    <path class="dash" d="M875,75 L875,123" marker-end="url(#arrow)"/>
    <text class="lbl" x="868" y="104" text-anchor="end">random audit</text>

    <!-- Row 2: monitoring and labelled data -->
    <rect class="mon" x="30" y="220" width="710" height="135" rx="10"/>
    <text class="head" x="50" y="246">Monitoring signals</text>
    <text class="col" x="50" y="270">Label-free (available immediately)</text>
    <text class="item" x="50" y="290">• Service health: latency, errors, throughput</text>
    <text class="item" x="50" y="307">• Input drift: text length, unseen vocabulary</text>
    <text class="item" x="50" y="324">• Predicted-code distribution (e.g. PSI)</text>
    <text class="item" x="50" y="341">• Confidence &amp; automation rate, model agreement</text>
    <text class="col" x="420" y="270">Label-based (delayed, partial)</text>
    <text class="item" x="420" y="290">• Accuracy / macro-F1 on the audit sample</text>
    <text class="item" x="420" y="307">• Calibration (ECE) on fresh labels</text>
    <text class="item" x="420" y="324">• Per-class errors, expert correction lists</text>

    <rect class="data" x="780" y="235" width="190" height="105" rx="10"/>
    <text class="head" x="796" y="261">Labelled data</text>
    <text class="sub" x="796" y="281">validated labels + history</text>
    <text class="sub" x="796" y="299">corrections applied</text>
    <text class="sub" x="796" y="317">versioned (Ch. 1)</text>

    <path class="edge" d="M390,110 L390,218" marker-end="url(#arrow)"/>
    <text class="lbl" x="398" y="168">every prediction</text>
    <path class="edge" d="M875,185 L875,233" marker-end="url(#arrow)"/>
    <path class="edge" d="M780,300 L742,300" marker-end="url(#arrow)"/>

    <!-- Row 3: retraining -->
    <rect class="retrain" x="30" y="400" width="940" height="120" rx="10"/>
    <text class="head" x="50" y="426">Retraining pipeline — the same reproducible code as Chapter 2</text>

    <rect class="chip" x="45" y="442" width="166" height="62" rx="8"/>
    <text class="chip-head" x="58" y="464">1. Trigger</text>
    <text class="sub" x="58" y="481">schedule · alert ·</text>
    <text class="sub" x="58" y="496">classification change</text>

    <rect class="chip" x="227" y="442" width="166" height="62" rx="8"/>
    <text class="chip-head" x="240" y="464">2. Train</text>
    <text class="sub" x="240" y="481">fixed seeds,</text>
    <text class="sub" x="240" y="496">versioned data</text>

    <rect class="chip" x="409" y="442" width="166" height="62" rx="8"/>
    <text class="chip-head" x="422" y="464">3. Validate</text>
    <text class="sub" x="422" y="481">against the champion,</text>
    <text class="sub" x="422" y="496">same metrics</text>

    <rect class="chip" x="591" y="442" width="166" height="62" rx="8"/>
    <text class="chip-head" x="604" y="464">4. Shadow / canary</text>
    <text class="sub" x="604" y="481">challenger on live</text>
    <text class="sub" x="604" y="496">traffic, no impact</text>

    <rect class="chip" x="773" y="442" width="166" height="62" rx="8"/>
    <text class="chip-head" x="786" y="464">5. Promote</text>
    <text class="sub" x="786" y="481">change registry tag;</text>
    <text class="sub" x="786" y="496">rollback = re-tag</text>

    <path class="edge" d="M211,473 L225,473" marker-end="url(#arrow)"/>
    <path class="edge" d="M393,473 L407,473" marker-end="url(#arrow)"/>
    <path class="edge" d="M575,473 L589,473" marker-end="url(#arrow)"/>
    <path class="edge" d="M757,473 L771,473" marker-end="url(#arrow)"/>

    <path class="edge" d="M128,355 L128,398" marker-end="url(#arrow)"/>
    <text class="lbl" x="136" y="382">alerts</text>
    <path class="edge" d="M875,340 L875,398" marker-end="url(#arrow)"/>
    <text class="lbl" x="883" y="374">training data</text>

    <!-- Loop back to production -->
    <path class="edge" d="M30,470 L-14,470 L-14,70 L28,70" marker-end="url(#arrow)"/>
    <text class="lbl" x="4" y="290" text-anchor="middle" transform="rotate(-90 4 290)">deploy version N+1</text>
  </g>
</svg>
